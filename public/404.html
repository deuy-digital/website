<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deuy Digital</title>
    <script>
      // GitHub Pages serves this file for any path with no matching static
      // file (e.g. a hard refresh on /impressum). It re-encodes the path
      // into a query string and redirects to the site root, where the
      // inline script in index.html restores it via history.replaceState
      // before React Router ever sees the URL.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
