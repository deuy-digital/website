<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restores the real URL after the SPA redirect from 404.html (see
      // public/404.html) — GitHub Pages has no server-side rewrites, so this
      // is what lets deep links like /impressum survive a hard refresh.
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
          // The prerendered markup below is for "/", not the restored URL.
          window.__SPA_REDIRECTED__ = true
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Deuy Digital UG (haftungsbeschränkt)" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d23" media="(prefers-color-scheme: dark)" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Deuy Digital",
        "legalName": "Deuy Digital UG (haftungsbeschränkt)",
        "url": "https://deuy.digital",
        "logo": "https://deuy.digital/favicon.svg",
        "email": "info@deuy.digital",
        "description": "Deuy Digital builds clean, modern digital products for businesses that want to move fast.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Im Wannental 23",
          "postalCode": "74074",
          "addressLocality": "Heilbronn",
          "addressCountry": "DE"
        }
      }
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('deuy-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <script>
      // English lives at /, German under /de/. Send the visitor to their
      // language before anything renders: an explicit choice from the language
      // switch (src/components/Layout.vue) wins; otherwise browser-language
      // detection runs on English URLs only. /de/ URLs are never redirected
      // without an explicit choice, so crawlers (no stored choice, English
      // browser) always see every URL as-is.
      (function (l) {
        var isDe = /^\/de(\/|$)/.test(l.pathname)
        var target = null
        try {
          target = localStorage.getItem('deuy-lang')
        } catch (e) {}
        if (target !== 'en' && target !== 'de') {
          target = null
          var langs = navigator.languages || [navigator.language]
          for (var i = 0; !isDe && i < langs.length; i++) {
            var lng = (langs[i] || '').toLowerCase().split('-')[0]
            if (lng === 'en' || lng === 'de') {
              target = lng
              break
            }
          }
        }
        var path = null
        if (target === 'de' && !isDe) path = l.pathname === '/' ? '/de/' : '/de' + l.pathname
        if (target === 'en' && isDe) path = l.pathname.replace(/^\/de/, '') || '/'
        if (path) l.replace(path + l.search + l.hash)
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
